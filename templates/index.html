{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-6">🧾 Bill එකක් හදන්න</h2>

{% if items %}
<form method="POST" action="/invoice/create" class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        {% for item in items %}
        <label class="bg-gray-900 rounded-xl p-4 flex items-center gap-3 hover:bg-gray-800 transition cursor-pointer">
            <input type="checkbox" name="item_ids" value="{{ item._id }}" class="w-5 h-5 accent-emerald-500">
            <div class="flex-1">
                <div class="font-semibold">{{ item.name }}</div>
                <div class="text-sm text-gray-400">Rs. {{ "%.2f"|format(item.price) }} • Stock: {{ item.stock }}</div>
            </div>
        </label>
        {% endfor %}
    </div>
    <button type="submit" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-500 transition px-6 py-3 rounded-xl font-semibold">
        Invoice එක හදන්න →
    </button>
</form>
{% else %}
<p class="text-gray-400">තාම items නෑ. <a href="/items" class="text-emerald-400 underline">Items page එකට ගිහින් add කරන්න</a>.</p>
{% endif %}
{% endblock %}
