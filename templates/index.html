{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-4 fade-in">Create a Bill</h2>

<form method="GET" action="/pos" class="mb-4 fade-in">
    <input name="q" value="{{ q }}" placeholder="Search items by name or barcode..." class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500 transition">
</form>

{% if items %}
<form method="POST" action="/invoice/create" class="space-y-4 fade-in" id="billForm">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        {% for item in items %}
        <div class="card-hover bg-gray-900 rounded-xl p-4 border border-gray-800">
            <label class="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" name="item_ids" value="{{ item._id }}" class="item-check w-5 h-5 accent-emerald-500" data-id="{{ item._id }}">
                <div class="flex-1">
                    <div class="font-semibold">{{ item.name }}</div>
                    <div class="text-sm text-gray-400">Rs. {{ "%.2f"|format(item.price) }} • Stock: {{ item.stock }}</div>
                </div>
            </label>
            <div class="mt-2 flex items-center gap-2 hidden qty-wrap" id="qty-wrap-{{ item._id }}">
                <label class="text-xs text-gray-400">Qty:</label>
                <input type="number" name="qty_{{ item._id }}" value="1" min="1" max="{{ item.stock }}"
                       class="qty-input bg-gray-800 rounded-lg px-2 py-1 text-sm w-20" data-price="{{ item.price }}" data-id="{{ item._id }}">
                <span class="text-xs text-emerald-400 line-total" id="line-total-{{ item._id }}">Rs. {{ "%.2f"|format(item.price) }}</span>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="bg-gray-900 rounded-xl p-4 grid grid-cols-1 md:grid-cols-3 gap-3 border border-gray-800">
        <select name="customer_id" class="bg-gray-800 rounded-lg px-3 py-2">
            <option value="">— No customer (walk-in) —</option>
            {% for c in customers %}
            <option value="{{ c._id }}">{{ c.name }}{% if c.phone %} ({{ c.phone }}){% endif %}</option>
            {% endfor %}
        </select>
        <select name="payment" class="bg-gray-800 rounded-lg px-3 py-2">
            <option>Cash</option>
            <option>Card</option>
            <option>Online Transfer</option>
        </select>
        <input name="discount" type="number" step="0.01" placeholder="Discount (Rs.)" class="bg-gray-800 rounded-lg px-3 py-2">
        <input name="tax_rate" type="number" step="0.01" placeholder="Tax %" value="{{ settings.tax_rate }}" class="bg-gray-800 rounded-lg px-3 py-2">
        <input name="notes" placeholder="Notes (optional)" class="bg-gray-800 rounded-lg px-3 py-2 md:col-span-2">
    </div>

    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800 flex justify-between items-center">
        <span class="text-gray-400">Estimated Subtotal</span>
        <span class="text-xl font-bold text-emerald-400" id="subtotal-display">Rs. 0.00</span>
    </div>

    <button type="submit" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-500 transition px-6 py-3 rounded-xl font-semibold shadow-lg shadow-emerald-900/40">
        Create Invoice
    </button>
</form>

<script>
function recalc() {
    let subtotal = 0;
    document.querySelectorAll('.item-check').forEach(cb => {
        const id = cb.dataset.id;
        const wrap = document.getElementById('qty-wrap-' + id);
        if (cb.checked) {
            wrap.classList.remove('hidden');
            const qtyInput = document.querySelector('.qty-input[data-id="' + id + '"]');
            const price = parseFloat(qtyInput.dataset.price);
            const maxStock = parseInt(qtyInput.max) || 9999;
            let qty = parseInt(qtyInput.value) || 1;
            if (qty < 1) qty = 1;
            if (qty > maxStock) {
                qty = maxStock;
                qtyInput.value = maxStock;
            }
            const lineTotal = price * qty;
            document.getElementById('line-total-' + id).textContent = 'Rs. ' + lineTotal.toFixed(2);
            subtotal += lineTotal;
        } else {
            wrap.classList.add('hidden');
        }
    });
    document.getElementById('subtotal-display').textContent = 'Rs. ' + subtotal.toFixed(2);
}

document.querySelectorAll('.item-check').forEach(cb => cb.addEventListener('change', recalc));
document.querySelectorAll('.qty-input').forEach(q => q.addEventListener('input', recalc));
recalc();
</script>
{% else %}
<p class="text-gray-400">No items yet. <a href="/items" class="text-emerald-400 underline">Add items first</a>.</p>
{% endif %}
{% endblock %}
