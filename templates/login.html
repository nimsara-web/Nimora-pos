<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimora POS &middot; Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b' } } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }

        @keyframes floatBlob {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(30px,-40px) scale(1.1); }
            66% { transform: translate(-25px,25px) scale(0.95); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .blob { animation: floatBlob 18s ease-in-out infinite; }
        .fade-up { animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both; }
        .fade-up.d1 { animation-delay: 0.12s; }
        .fade-up.d2 { animation-delay: 0.24s; }
        .fade-up.d3 { animation-delay: 0.36s; }
        .shake { animation: shake 0.35s ease; }

        .glass-card {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(55, 65, 81, 0.6);
            box-shadow: 0 24px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .input-field {
            transition: all 0.2s ease;
        }
        .input-field:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
            background: rgba(31,41,55,0.9);
        }
        .btn-glow {
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }
        .btn-glow::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }
        .btn-glow:hover::after { transform: translateX(100%); }
        .btn-glow:hover { box-shadow: 0 12px 32px rgba(16,185,129,0.35); transform: translateY(-1px); }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Ambient background blobs -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <div class="blob absolute -top-32 -left-32 w-96 h-96 rounded-full bg-brand-500/20 blur-3xl"></div>
        <div class="blob absolute -bottom-40 -right-32 w-[28rem] h-[28rem] rounded-full bg-brand-700/20 blur-3xl" style="animation-delay:-6s"></div>
        <div class="blob absolute top-1/3 left-1/2 w-72 h-72 rounded-full bg-emerald-400/10 blur-3xl" style="animation-delay:-12s"></div>
    </div>

    <!-- Grid overlay -->
    <div class="absolute inset-0 opacity-[0.04] pointer-events-none"
         style="background-image: linear-gradient(#34d399 1px, transparent 1px), linear-gradient(90deg,#34d399 1px, transparent 1px); background-size: 48px 48px;"></div>

    <!-- Card -->
    <div class="glass-card rounded-3xl p-8 w-full max-w-md relative fade-up">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-400 to-brand-700 flex items-center justify-center shadow-xl shadow-brand-900/40 mb-4 fade-up d1">
                <span class="text-white font-extrabold text-2xl">N</span>
            </div>
            <h1 class="text-2xl font-bold fade-up d1">Nimora <span class="text-brand-400">POS</span></h1>
            <p class="text-sm text-gray-400 mt-1 fade-up d2">Sign in to your dashboard</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="mb-4 space-y-2">
                {% for msg in messages %}
                <div class="bg-red-900/40 border border-red-700/60 text-red-200 p-3 rounded-xl text-sm fade-up shake">
                    {{ msg }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="space-y-4">
            <div class="fade-up d1">
                <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider">Username</label>
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/></svg>
                    <input name="username" required autofocus
                           class="input-field w-full bg-gray-800/60 border border-gray-700 rounded-xl pl-10 pr-3 py-3 text-sm focus:outline-none placeholder-gray-500"
                           placeholder="Enter username">
                </div>
            </div>

            <div class="fade-up d2">
                <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <input id="password" name="password" type="password" required
                           class="input-field w-full bg-gray-800/60 border border-gray-700 rounded-xl pl-10 pr-10 py-3 text-sm focus:outline-none placeholder-gray-500"
                           placeholder="Enter password">
                    <button type="button" onclick="togglePw()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-brand-400 transition">
                        <svg id="eye" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit"
                    class="btn-glow fade-up d3 w-full bg-gradient-to-r from-brand-500 to-brand-600 text-white font-semibold rounded-xl py-3 text-sm tracking-wide">
                Sign In
            </button>
        </form>

        <p class="text-center text-[11px] text-gray-600 mt-6 fade-up d3">
            Default: <span class="text-gray-400 font-mono">admin / admin123</span>
        </p>
    </div>

    <script>
        function togglePw() {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
