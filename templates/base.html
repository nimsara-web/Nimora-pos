<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimora POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/print.css') }}">
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out both; }
        .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(16,185,129,0.15); }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <div class="flex flex-col md:flex-row">
        <aside class="no-print md:w-60 bg-gray-900/80 backdrop-blur p-4 space-y-2 md:min-h-screen border-r border-gray-800">
            <h1 class="text-xl font-bold mb-6 px-2">Nimora <span class="text-emerald-400">POS</span></h1>
            <a href="/" class="block px-3 py-2 rounded-lg hover:bg-gray-800 transition">Dashboard</a>
            <a href="/pos" class="block px-3 py-2 rounded-lg hover:bg-gray-800 transition">Billing</a>
            <a href="/items" class="block px-3 py-2 rounded-lg hover:bg-gray-800 transition">Items</a>
            <a href="/invoices" class="block px-3 py-2 rounded-lg hover:bg-gray-800 transition">Invoices</a>
        </aside>
        <main class="flex-1 p-4 md:p-8">
            {% with messages = get_flashed_messages() %}
                {% for msg in messages %}
                <div class="no-print fade-in bg-emerald-900/70 border border-emerald-700 text-emerald-200 p-3 rounded-lg mb-4">{{ msg }}</div>
                {% endfor %}
            {% endwith %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
