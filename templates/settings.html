{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-6 fade-in">Settings</h2>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- Business Settings -->
    <form method="POST" action="/settings" class="bg-gray-900 rounded-xl p-5 border border-gray-800 fade-in">
        <h3 class="font-semibold mb-4 text-brand-400">Business Information</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <input name="business_name" value="{{ settings.business_name }}" placeholder="Business name" class="bg-gray-800 rounded-lg px-3 py-2">
            <input name="phone" value="{{ settings.phone }}" placeholder="Phone" class="bg-gray-800 rounded-lg px-3 py-2">
            <input name="logo_url" value="{{ settings.logo_url }}" placeholder="Logo URL" class="bg-gray-800 rounded-lg px-3 py-2 md:col-span-2">
            <input name="address" value="{{ settings.address }}" placeholder="Address" class="bg-gray-800 rounded-lg px-3 py-2 md:col-span-2">
            <input name="currency" value="{{ settings.currency }}" placeholder="Currency symbol" class="bg-gray-800 rounded-lg px-3 py-2">
            <input name="tax_rate" type="number" step="0.01" value="{{ settings.tax_rate }}" placeholder="Default tax %" class="bg-gray-800 rounded-lg px-3 py-2">
            <input name="low_stock_threshold" type="number" value="{{ settings.low_stock_threshold }}" placeholder="Low stock threshold" class="bg-gray-800 rounded-lg px-3 py-2">
            <input name="whatsapp_country" value="{{ settings.whatsapp_country }}" placeholder="WhatsApp country code (e.g. 94)" class="bg-gray-800 rounded-lg px-3 py-2">
            <input name="footer_note" value="{{ settings.footer_note }}" placeholder="Invoice footer note" class="bg-gray-800 rounded-lg px-3 py-2 md:col-span-2">
        </div>
        <button type="submit" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-500 transition rounded-lg px-4 py-2 font-semibold">Save Settings</button>
    </form>

    <!-- Change Password -->
    <form method="POST" action="/change-password" class="bg-gray-900 rounded-xl p-5 border border-gray-800 fade-in">
        <h3 class="font-semibold mb-4 text-brand-400">Change My Password</h3>
        <div class="space-y-3">
            <div>
                <label class="text-xs text-gray-400 mb-1 block">Current Password</label>
                <input name="current_password" type="password" required class="w-full bg-gray-800 rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="text-xs text-gray-400 mb-1 block">New Password</label>
                <input name="new_password" type="password" required minlength="6" class="w-full bg-gray-800 rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="text-xs text-gray-400 mb-1 block">Confirm New Password</label>
                <input name="confirm_password" type="password" required minlength="6" class="w-full bg-gray-800 rounded-lg px-3 py-2">
            </div>
        </div>
        <button type="submit" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 transition rounded-lg px-4 py-2 font-semibold">Update Password</button>
        <p class="text-xs text-gray-500 mt-3">Password must be at least 6 characters.</p>
    </form>

</div>
{% endblock %}
