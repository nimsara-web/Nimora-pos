{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-6 fade-in">Settings</h2>

<form method="POST" action="/settings" class="bg-gray-900 rounded-xl p-5 grid grid-cols-1 md:grid-cols-2 gap-4 border border-gray-800 fade-in">
    <input name="business_name" value="{{ settings.business_name }}" placeholder="Business name" class="bg-gray-800 rounded-lg px-3 py-2">
    <input name="phone" value="{{ settings.phone }}" placeholder="Phone" class="bg-gray-800 rounded-lg px-3 py-2">
    <input name="logo_url" value="{{ settings.logo_url }}" placeholder="Logo URL" class="bg-gray-800 rounded-lg px-3 py-2 md:col-span-2">
    <input name="address" value="{{ settings.address }}" placeholder="Address" class="bg-gray-800 rounded-lg px-3 py-2 md:col-span-2">
    <input name="currency" value="{{ settings.currency }}" placeholder="Currency symbol" class="bg-gray-800 rounded-lg px-3 py-2">
    <input name="tax_rate" type="number" step="0.01" value="{{ settings.tax_rate }}" placeholder="Default tax %" class="bg-gray-800 rounded-lg px-3 py-2">
    <input name="low_stock_threshold" type="number" value="{{ settings.low_stock_threshold }}" placeholder="Low stock threshold" class="bg-gray-800 rounded-lg px-3 py-2">
    <input name="footer_note" value="{{ settings.footer_note }}" placeholder="Invoice footer note" class="bg-gray-800 rounded-lg px-3 py-2 md:col-span-2">
    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 transition rounded-lg px-4 py-2 font-semibold md:col-span-2">Save Settings</button>
</form>
{% endblock %}
