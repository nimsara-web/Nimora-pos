{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-6 fade-in">Purchases</h2>
<form method="POST" action="/purchases" class="bg-gray-900 rounded-xl p-4 mb-6 grid grid-cols-1 md:grid-cols-2 gap-3 border border-gray-800 fade-in">
    <select name="item" required class="bg-gray-800 rounded-lg px-3 py-2">
        <option value="">Select item</option>
        {% for it in items %}<option value="{{ it.name }}">{{ it.name }}</option>{% endfor %}
    </select>
    <select name="supplier" class="bg-gray-800 rounded-lg px-3 py-2">
        <option value="">No supplier</option>
        {% for s in suppliers %}<option value="{{ s.name }}">{{ s.name }}</option>{% endfor %}
    </select>
    <input name="quantity" type="number" placeholder="Quantity" required class="bg-gray-800 rounded-lg px-3 py-2">
    <input name="total" type="number" step="0.01" placeholder="Total cost" required class="bg-gray-800 rounded-lg px-3 py-2">
    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 transition rounded-lg px-4 py-2 font-semibold md:col-span-2">+ Record Purchase</button>
</form>
<div class="space-y-2 fade-in">
    {% for p in purchases %}
    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
        <div class="flex justify-between">
            <span class="font-semibold">{{ p.item }} x{{ p.quantity }}</span>
            <span class="text-emerald-400">Rs. {{ "%.2f"|format(p.total) }}</span>
        </div>
        <div class="text-sm text-gray-400">{{ p.created_at.strftime('%Y-%m-%d %H:%M') }}{% if p.supplier %} • {{ p.supplier }}{% endif %}</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
