{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-6">📦 Items</h2>

<form method="POST" action="/items" class="bg-gray-900 rounded-xl p-4 mb-6 grid grid-cols-1 md:grid-cols-4 gap-3">
    <input name="name" placeholder="Item name" required class="bg-gray-800 rounded-lg px-3 py-2">
    <input name="price" type="number" step="0.01" placeholder="Price" required class="bg-gray-800 rounded-lg px-3 py-2">
    <input name="stock" type="number" placeholder="Stock" class="bg-gray-800 rounded-lg px-3 py-2">
    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 transition rounded-lg px-4 py-2 font-semibold">+ Add</button>
</form>

{% if edit_item %}
<form method="POST" action="/item/edit/{{ edit_item._id }}" class="bg-gray-800 rounded-xl p-4 mb-6 grid grid-cols-1 md:grid-cols-4 gap-3">
    <input name="name" value="{{ edit_item.name }}" required class="bg-gray-700 rounded-lg px-3 py-2">
    <input name="price" type="number" step="0.01" value="{{ edit_item.price }}" required class="bg-gray-700 rounded-lg px-3 py-2">
    <input name="stock" type="number" value="{{ edit_item.stock }}" class="bg-gray-700 rounded-lg px-3 py-2">
    <button type="submit" class="bg-yellow-600 hover:bg-yellow-500 transition rounded-lg px-4 py-2 font-semibold">Save</button>
</form>
{% endif %}

<div class="space-y-2">
    {% for item in items %}
    <div class="bg-gray-900 rounded-xl p-4 flex items-center justify-between gap-3">
        <div>
            <div class="font-semibold">{{ item.name }}</div>
            <div class="text-sm text-gray-400">Rs. {{ "%.2f"|format(item.price) }} • Stock: {{ item.stock }}</div>
        </div>
        <div class="flex gap-2">
            <a href="/item/edit/{{ item._id }}" class="bg-gray-700 hover:bg-gray-600 transition px-3 py-2 rounded-lg text-sm">Edit</a>
            <a href="/item/delete/{{ item._id }}" onclick="return confirm('Delete කරන්නද?')" class="bg-red-700 hover:bg-red-600 transition px-3 py-2 rounded-lg text-sm">Delete</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
