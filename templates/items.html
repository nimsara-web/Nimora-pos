{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-6 fade-in">Items</h2>

<form method="POST" action="/items" class="bg-gray-900 rounded-xl p-4 mb-6 grid grid-cols-1 md:grid-cols-3 gap-3 border border-gray-800 fade-in">
    <input name="name" placeholder="Item name" required class="bg-gray-800 rounded-lg px-3 py-2">
    <input name="price" type="number" step="0.01" placeholder="Selling price" required class="bg-gray-800 rounded-lg px-3 py-2">
    <input name="cost" type="number" step="0.01" placeholder="Cost price" class="bg-gray-800 rounded-lg px-3 py-2">
    <input name="stock" type="number" placeholder="Stock" class="bg-gray-800 rounded-lg px-3 py-2">
    <input name="barcode" placeholder="Barcode (optional)" class="bg-gray-800 rounded-lg px-3 py-2">
    <select name="supplier" class="bg-gray-800 rounded-lg px-3 py-2">
        <option value="">No supplier</option>
        {% for s in suppliers %}
        <option value="{{ s.name }}">{{ s.name }}</option>
        {% endfor %}
    </select>
    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 transition rounded-lg px-4 py-2 font-semibold md:col-span-3">+ Add Item</button>
</form>

{% if edit_item %}
<form method="POST" action="/item/edit/{{ edit_item._id }}" class="bg-gray-800 rounded-xl p-4 mb-6 grid grid-cols-1 md:grid-cols-3 gap-3 border border-yellow-700 fade-in">
    <input name="name" value="{{ edit_item.name }}" required class="bg-gray-700 rounded-lg px-3 py-2">
    <input name="price" type="number" step="0.01" value="{{ edit_item.price }}" required class="bg-gray-700 rounded-lg px-3 py-2">
    <input name="cost" type="number" step="0.01" value="{{ edit_item.cost or 0 }}" class="bg-gray-700 rounded-lg px-3 py-2">
    <input name="stock" type="number" value="{{ edit_item.stock }}" class="bg-gray-700 rounded-lg px-3 py-2">
    <input name="barcode" value="{{ edit_item.barcode or '' }}" class="bg-gray-700 rounded-lg px-3 py-2">
    <select name="supplier" class="bg-gray-700 rounded-lg px-3 py-2">
        <option value="">No supplier</option>
        {% for s in suppliers %}
        <option value="{{ s.name }}" {% if edit_item.supplier == s.name %}selected{% endif %}>{{ s.name }}</option>
        {% endfor %}
    </select>
    <button type="submit" class="bg-yellow-600 hover:bg-yellow-500 transition rounded-lg px-4 py-2 font-semibold md:col-span-3">Save Changes</button>
</form>
{% endif %}

<div class="space-y-2 fade-in">
    {% for item in items %}
    <div class="card-hover bg-gray-900 rounded-xl p-4 flex items-center justify-between gap-3 border border-gray-800">
        <div>
            <div class="font-semibold">{{ item.name }}</div>
            <div class="text-sm text-gray-400">Rs. {{ "%.2f"|format(item.price) }} • Stock: {{ item.stock }}{% if item.supplier %} • {{ item.supplier }}{% endif %}</div>
        </div>
        <div class="flex gap-2">
            <a href="/item/edit/{{ item._id }}" class="bg-gray-700 hover:bg-gray-600 transition px-3 py-2 rounded-lg text-sm">Edit</a>
            <a href="/item/delete/{{ item._id }}" onclick="return confirm('Delete this item?')" class="bg-red-700 hover:bg-red-600 transition px-3 py-2 rounded-lg text-sm">Delete</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
